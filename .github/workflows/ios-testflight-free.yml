name: iOS TestFlight (FREE — macOS runner, no EAS cloud)

# Restored from Wingman's free pattern (which itself was originally adapted FROM CAPS
# per ci-setup-ios-creds.js header). Bypasses the EAS Free-plan iOS cloud quota wall.
#
# COST: $0/build
# How it works:
#   1. scripts/ci-setup-ios-creds.js — hardened ASC API flow: deny-lists known-revoked
#      cert serials, deletes unsafe Apple certs, creates a fresh IOS_DISTRIBUTION cert,
#      wires it into EAS along with a new provisioning profile.
#   2. eas build --local — builds the IPA on the macOS-15 runner (NOT EAS cloud, so
#      does not count against the Free-plan iOS-build quota).
#   3. xcrun altool --upload-app — submits directly to TestFlight via the ASC API key.
#
# Secrets required (ALL ALREADY SET on royea-beep/caps-poker — see `gh secret list`):
#   EXPO_TOKEN              — Expo account token (EAS credential lookup, not cloud build)
#   APPLE_API_KEY_BASE64    — Base64 of AuthKey_HH732W7XQJ.p8
#   APPLE_API_KEY_ID        — HH732W7XQJ
#   APPLE_API_ISSUER_ID     — 686f97b8-3f8a-40b7-a6cd-5293a3168439

on:
  # VAMOS-BUILD-HARDEN 2026-06-16 — REMOVED the broad path-based push trigger.
  # Auto-firing on every app/** push burned the Apple per-app daily upload quota
  # (~10/day) on 2026-06-16: builds 500 + 501 hit 409 "Upload limit reached".
  # Builds are now deliberate: workflow_dispatch (gh workflow run) or `build-*` tag.
  # Web deploy stays auto (no Apple quota).
  push:
    tags:
      - 'build-*'
  workflow_dispatch:

concurrency:
  # VAMOS-BUILD-DIAGNOSE 2026-06-16 — newer pushes cancel older in-flight builds.
  # Was cancel-in-progress: false; today's rapid 498/499/500/501 cycle burned the
  # Apple per-app daily upload quota (10/day) — 500 + 501 hit 409 "Upload limit
  # reached". Latest push should win; older races should not race to upload.
  group: ios-testflight-free-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight (FREE)
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Write Apple API key to repo root (CWD for the script)
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Select latest Xcode available on runner
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then echo "No Xcode found"; exit 1; fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup iOS credentials (hardened cert + PP via ASC API)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/ci-setup-ios-creds.js

      - name: EAS Build — LOCAL (runs on this runner, NOT EAS cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --local \
            --output "$RUNNER_TEMP/CapsPoker.ipa"

      - name: Submit to TestFlight via xcrun altool
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        # VAMOS-BUILD-HARDEN 2026-06-16 — fail-fast on altool errors.
        # Was: validate piped through `| tail -20 || true` (swallowed exit code) and
        # upload's inner ERROR/409 still let the GitHub step return success. Today's
        # builds 500 + 501 hit Apple's 409 "Upload limit reached" and STILL reported
        # green. Now: strict shell + tee logs + grep for "UPLOAD SUCCEEDED" and absence
        # of "UPLOAD FAILED" / "VERIFY FAILED" — any other state exits 1 (RED run).
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          IPA_PATH="$RUNNER_TEMP/CapsPoker.ipa"
          echo "IPA path: $IPA_PATH"
          ls -lh "$IPA_PATH"

          echo "--- Validating IPA before upload ---"
          VALIDATE_LOG="$RUNNER_TEMP/altool-validate.log"
          set +e
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" 2>&1 | tee "$VALIDATE_LOG"
          VALIDATE_RC=${PIPESTATUS[0]}
          set -e
          if [ "$VALIDATE_RC" -ne 0 ] \
             || grep -qE "VERIFY FAILED|Validation failed|ERROR ITMS|Upload limit reached|ITMS-409|HTTP[ /]+409" "$VALIDATE_LOG"; then
            echo "::error::altool VALIDATE failed (rc=$VALIDATE_RC). See log above."
            exit 1
          fi

          echo "--- Uploading to TestFlight ---"
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          UPLOAD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$UPLOAD_RC" -ne 0 ] \
             || grep -qE "UPLOAD FAILED|VERIFY FAILED|Validation failed|ERROR ITMS|Upload limit reached|ITMS-409|HTTP[ /]+409" "$UPLOAD_LOG" \
             || ! grep -qE "UPLOAD SUCCEEDED" "$UPLOAD_LOG"; then
            echo "::error::altool UPLOAD failed (rc=$UPLOAD_RC) or no 'UPLOAD SUCCEEDED' marker. See log above."
            exit 1
          fi
          echo "✅ altool upload confirmed."

      - name: Cleanup key files
        if: always()
        run: |
          rm -f AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
