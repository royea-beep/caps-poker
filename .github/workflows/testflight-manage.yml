name: Manage TestFlight

# ⚠️ THIS WORKFLOW AUTHENTICATES WITH THE APP STORE CONNECT API KEY, NOT AN APPLE ID.
#
# It used to log in as royearguan@gmail.com with an app-specific password plus a cached
# FASTLANE_SESSION cookie. That path is DEAD and had never once succeeded: all four dispatches
# before 2026-09-07 failed, the last two with "Invalid username and password combination" and
# "The login credentials for 'royearguan@gmail.com' seem to be wrong". This is the expected end
# state for that mechanism — an app-specific password is revoked whenever the Apple ID password
# changes, and a FASTLANE_SESSION cookie expires after about a month regardless.
#
# Meanwhile every OTHER App Store Connect workflow in this repo — ios-testflight.yml,
# ios-testflight-free.yml, asc-submit.yml, asc-cert-audit.yml, asc-fetch-profile.yml,
# delete-asc-version.yml — has been using the API key all along, and it works: it uploaded build
# 514 on 2026-09-02. This file was simply the last one still on the old path.
#
# So the key setup step below is copied from ios-testflight.yml (its "Setup App Store Connect API
# key" step), and Spaceship::ConnectAPI.login(user) becomes .auth(key_id:, issuer_id:, filepath:).
# NO NEW SECRET IS NEEDED — APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_BASE64 already
# exist and are already proven.
#
# ⚠️ THE LONGER ACTIONS LIVE IN tools/asc/*.rb, NOT INLINE HERE, AND THAT IS NOT A STYLE CHOICE.
# GitHub compiles a `run:` block as a single expression and caps it at 21,000 characters. Inlining
# compare-apps broke the workflow outright: "Exceeded max expression length 21000". Anything
# substantial goes in a file; the YAML stays a dispatcher.
#
# ⚠️ AND ONE CAVEAT I WROTE AND THEN DISPROVED, KEPT HERE SO NOBODY RE-ADDS IT. I first warned that
# API-key auth might not see INTERNAL testers, since an internal tester is an App Store Connect
# user rather than a plain email. Run 34104520373 showed otherwise: it listed a tester who belongs
# to BOTH "Internal Testers" and "Friends". The key sees both groups. The listing still prints the
# groups, because which group a tester is in decides whether they wait on Beta App Review — but it
# prints them as useful information, not as an apology for a blind spot that does not exist.
#
# ⚠️ EVERY ATTRIBUTE IS READ THROUGH `safe()`. That same run died on `undefined method 'state'` —
# a field that does not exist on this Spaceship version — AFTER it had already authenticated,
# found the app and printed both groups. One wrong attribute name threw the whole listing away.
# A reporting job must not be able to lose the report it already has.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - compare-apps
          - entitlement
          - distribute
          - pipeline-distribute-selftest
          - resend-invite
          - build-state
          - list-testers
          - list-builds
          - answer-export-compliance
          - add-tester
          - enable-public-link
          - set-public-link
          - store-listing
      email:
        description: 'Tester email (for add-tester action)'
        required: false
        type: string
      build:
        description: 'Build number (for build-state / answer-export-compliance / distribute)'
        required: false
        type: string
      link_enabled:
        description: 'set-public-link: true re-enables the public link, false disables it'
        required: false
        default: false
        type: boolean
      groups:
        description: 'Comma-separated beta group names (distribute; blank = every group)'
        required: false
        type: string
      submit_beta_review:
        description: 'distribute: also submit for Beta App Review (EXTERNAL testing only — this is a real review with a real wait)'
        required: false
        default: false
        type: boolean

jobs:
  manage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane

      # Copied from ios-testflight.yml — the setup that is proven to work.
      - name: Setup App Store Connect API key
        env:
          API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -eu
          if [ -z "${API_KEY_ID:-}" ] || [ -z "${API_KEY_BASE64:-}" ]; then
            echo "::error::APPLE_API_KEY_ID / APPLE_API_KEY_BASE64 missing."
            exit 1
          fi
          mkdir -p ~/private_keys
          printf %s "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Run TestFlight management
        env:
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_IDENTIFIER: com.capspoker.app
          APPLE_TEAM_ID: 3K9KJNGL9U
          ASC_APP_ID: "6760429619"
          TESTER_EMAIL: ${{ github.event.inputs.email }}
          DEFAULT_TESTER_EMAIL: royearguan@gmail.com
          BUILD_NUMBER: ${{ github.event.inputs.build }}
          DISTRIBUTE_GROUPS: ${{ github.event.inputs.groups }}
          SUBMIT_BETA_REVIEW: ${{ github.event.inputs.submit_beta_review }}
          LINK_ENABLED: ${{ github.event.inputs.link_enabled }}
        run: |
          set -eu
          ACTION="${{ github.event.inputs.action }}"

          # One shared auth preamble, so no action can accidentally use a different credential.
          cat > /tmp/asc_auth.rb <<'RUBY'
            require "spaceship"
            def asc_login!
              key_id    = ENV.fetch("APPLE_API_KEY_ID")
              issuer_id = ENV.fetch("APPLE_API_ISSUER_ID")
              path      = File.expand_path("~/private_keys/AuthKey_#{key_id}.p8")
              raise "missing #{path}" unless File.exist?(path)
              Spaceship::ConnectAPI.auth(key_id: key_id, issuer_id: issuer_id, filepath: path)
              puts "Authenticated to App Store Connect with API key #{key_id}."
            end

            # Read an attribute without letting a missing one kill the whole listing.
            def safe(obj, *names)
              names.each do |n|
                begin
                  v = obj.public_send(n)
                  return v unless v.nil?
                rescue StandardError
                  next
                end
              end
              nil
            end
          RUBY

          case "$ACTION" in
            "compare-apps")
              ruby tools/asc/compare_apps.rb
              ;;

            "entitlement")
              # ⚠️ THE QUESTION build-state CANNOT ANSWER.
              # It proves a build is installable by SOMEBODY internal. This proves whether a
              # NAMED Apple ID can install it — which is per-tester-per-group, not per-build.
              ruby tools/asc/entitlement.rb
              ;;

            "distribute")
              # ⚠️ THE STEP THE BUILD PIPELINE NEVER HAD. An upload is not a distribution:
              # ios-testflight.yml ends at altool, so nothing has ever attached a CAPS build to a
              # group. Internal picked builds up anyway (hasAccessToAllBuilds), which is precisely
              # what hid the gap. Same script the pipeline now runs — see tools/asc/ensure_distribution.rb.
              ruby tools/asc/ensure_distribution.rb
              ;;

            "pipeline-distribute-selftest")
              # ⚠️ THE POINT OF THIS ACTION IS THAT IT IS NOT A READING OF THE WORKFLOW.
              # It runs tools/asc/distribute_current_build.sh with the SAME environment
              # ios-testflight.yml gives it, so the build number really is read from app.json and
              # the attachment really is attempted against every group. The only thing it does not
              # do is produce the .ipa — and an archive is not what was ever in doubt.
              export DISTRIBUTE_GROUPS=""
              export SUBMIT_BETA_REVIEW="false"
              export WAIT_MINUTES="0"
              bash tools/asc/distribute_current_build.sh
              ;;

            "store-listing")
              # ⚠️ THE-LAST-GAPS 2026-09-08 — THE ONLY ACTION HERE THAT IS NOT ABOUT TESTFLIGHT.
              # It reads the App Store listing: name, subtitle, description, keywords, categories,
              # age rating, privacy URLs, support URL and every screenshot. STRICTLY READ ONLY —
              # no PATCH, no POST, nothing submitted. Metadata edits can trigger review, and Roye
              # has not asked to submit anything.
              ruby tools/asc/store_listing.rb
              ;;

            "set-public-link")
              # ⚠️ THE VERDICT COMES FROM THE READ-BACK, NOT FROM THE PATCH STATUS.
              # This turns the public link off (or back on) and then asks Apple what it holds.
              # It submits nothing for review and removes no tester — disabling a link closes the
              # door, it does not evict anyone already inside.
              ruby tools/asc/public_link.rb
              ;;

            "resend-invite")
              if [ -z "${TESTER_EMAIL:-}" ]; then echo "::error::email required for resend-invite"; exit 1; fi
              ruby tools/asc/resend_invite.rb
              ;;

            "build-state")
              # ⚠️ RAW REST, NOT THE SPACESHIP MODEL WRAPPER, AND THAT IS DELIBERATE.
              # build.get_beta_groups raises NoMethodError on this Spaceship version — it already
              # cost one report. "Uploaded" and "installable" are different states and every one of
              # the ways they diverge (still PROCESSING, processing failed, expired, export
              # compliance unanswered, never attached to a group) is a FIELD in Apple's API. So this
              # asks Apple directly and prints what comes back, including the raw JSON, rather than
              # asking a wrapper that may not expose the field that matters.
              ruby -e '
                require "jwt"; require "net/http"; require "json"; require "uri"

                key_id    = ENV.fetch("APPLE_API_KEY_ID")
                issuer_id = ENV.fetch("APPLE_API_ISSUER_ID")
                pem       = File.read(File.expand_path("~/private_keys/AuthKey_#{key_id}.p8"))
                token = JWT.encode(
                  { iss: issuer_id, exp: Time.now.to_i + 600, aud: "appstoreconnect-v1" },
                  OpenSSL::PKey::EC.new(pem), "ES256", { kid: key_id, typ: "JWT" }
                )

                def get(path, token)
                  uri = URI("https://api.appstoreconnect.apple.com#{path}")
                  req = Net::HTTP::Get.new(uri)
                  req["Authorization"] = "Bearer #{token}"
                  res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
                  [res.code.to_i, (JSON.parse(res.body) rescue { "raw" => res.body })]
                end

                app_id = ENV.fetch("ASC_APP_ID")
                want   = ENV["BUILD_NUMBER"].to_s.strip

                code, body = get("/v1/builds?filter[app]=#{app_id}&limit=10&sort=-uploadedDate" \
                                 "&include=buildBetaDetail,preReleaseVersion", token)
                abort("builds query failed: HTTP #{code} #{body}") unless code == 200

                included = (body["included"] || [])
                detail_for = lambda do |b|
                  rel = b.dig("relationships", "buildBetaDetail", "data")
                  rel && included.find { |i| i["type"] == "buildBetaDetails" && i["id"] == rel["id"] }
                end

                builds = body["data"] || []
                target = want.empty? ? builds.first : builds.find { |b| b.dig("attributes", "version") == want }

                if target.nil?
                  puts "❌ BUILD #{want.empty? ? "(latest)" : want} IS NOT IN APP STORE CONNECT."
                  puts "   Newest #{builds.length} builds Apple has:"
                  builds.each { |b| puts "     #{b.dig("attributes","version")} — #{b.dig("attributes","processingState")} — #{b.dig("attributes","uploadedDate")}" }
                  exit 1
                end

                a  = target["attributes"]
                bd = detail_for.call(target)
                bda = bd && bd["attributes"]

                puts "=== BUILD #{a["version"]} — WHAT APPLE ACTUALLY HOLDS ==="
                puts "  id                        #{target["id"]}"
                puts "  version (build number)    #{a["version"]}"
                puts "  uploaded                  #{a["uploadedDate"]}"
                puts "  processingState           #{a["processingState"]}"
                puts "  expired                   #{a["expired"]}"
                puts "  expirationDate            #{a["expirationDate"]}"
                puts "  usesNonExemptEncryption   #{a["usesNonExemptEncryption"].inspect}   <- nil means EXPORT COMPLIANCE UNANSWERED"
                puts "  minOsVersion              #{a["minOsVersion"]}"
                if bda
                  puts "  internalBuildState        #{bda["internalBuildState"]}"
                  puts "  externalBuildState        #{bda["externalBuildState"]}"
                  puts "  autoNotifyEnabled         #{bda["autoNotifyEnabled"]}"
                end
                puts ""

                # ⚠️ THE RELATIONSHIP IS READ FROM THE GROUP SIDE, AND THE FIRST VERSION OF THIS GOT
                # IT WRONG. GET /v1/builds/{id}/betaGroups returns HTTP 403 — "The relationship
                # 'betaGroups' does not allow 'GET_RELATED'. Allowed operations are: CREATE,
                # DELETE." Apple only exposes that edge in the other direction. Asking the wrong way
                # produced an empty list, and the verdict below then reported "not attached to any
                # INTERNAL beta group" — A FAILED READ PRESENTED AS A FINDING, which is the exact
                # mistake this whole action exists to prevent.
                puts "=== IS IT ATTACHED TO A BETA GROUP? ==="
                gcode, gbody = get("/v1/betaGroups?filter[builds]=#{target["id"]}&limit=50", token)
                groups = (gbody["data"] || [])
                groups_readable = (gcode == 200)
                if !groups_readable
                  puts "  ⚠️ COULD NOT READ: HTTP #{gcode} #{gbody}"
                  puts "  (this is an UNKNOWN, not a NO — the verdict below says so)"
                elsif groups.empty?
                  puts "  ⚠️ NOT ATTACHED TO ANY BETA GROUP"
                else
                  groups.each do |g|
                    ga = g["attributes"]
                    puts "  #{ga["name"]} — #{ga["isInternalGroup"] ? "INTERNAL" : "EXTERNAL"} — hasAccessToAllBuilds: #{ga["hasAccessToAllBuilds"]}"
                  end
                end
                puts ""

                puts "=== WHAT APPLE SAYS ABOUT THE TESTERS ==="
                tcode, tbody = get("/v1/betaTesters?filter[apps]=#{app_id}&limit=50&include=betaGroups", token)
                if tcode != 200
                  puts "  query failed: HTTP #{tcode}"
                else
                  inc = (tbody["included"] || [])
                  (tbody["data"] || []).each do |t|
                    ta = t["attributes"]
                    gids = (t.dig("relationships","betaGroups","data") || []).map { |d| d["id"] }
                    gnames = inc.select { |i| i["type"] == "betaGroups" && gids.include?(i["id"]) }
                                .map { |i| i.dig("attributes","name") }
                    puts "  #{ta["email"]} — #{[ta["firstName"], ta["lastName"]].compact.join(" ")} — " \
                         "inviteType: #{ta["inviteType"]} — state: #{ta["state"].inspect} — groups: #{gnames.join(", ")}"
                  end
                end
                puts ""

                # ── THE VERDICT, DERIVED FROM THOSE FIELDS AND NOTHING ELSE ──────────────────────
                # ⚠️ A BLOCKER IS SOMETHING APPLE SAID, NEVER SOMETHING I FAILED TO READ.
                # internalBuildState is the field that actually decides internal availability:
                # Apple sets IN_BETA_TESTING only once the build is live to internal testers, and
                # READY_FOR_BETA_TESTING once it is eligible. The group attachment is corroborating
                # detail, so an unreadable one is reported as UNKNOWN and never as a blocker.
                blockers = []
                unknowns = []
                blockers << "processingState is #{a["processingState"]}, not VALID" unless a["processingState"] == "VALID"
                blockers << "the build is EXPIRED"                                   if a["expired"]
                blockers << "export compliance is UNANSWERED (usesNonExemptEncryption is null)" if a["usesNonExemptEncryption"].nil?

                ibs = bda && bda["internalBuildState"]
                if ibs.nil?
                  unknowns << "internalBuildState could not be read"
                elsif !%w[READY_FOR_BETA_TESTING IN_BETA_TESTING].include?(ibs)
                  blockers << "internalBuildState is #{ibs}"
                end

                if !groups_readable
                  unknowns << "beta-group attachment could not be read (Apple forbids GET on that relationship)"
                elsif !groups.any? { |g| g.dig("attributes","isInternalGroup") }
                  blockers << "not attached to any INTERNAL beta group"
                end

                puts "=== IS IT INSTALLABLE BY AN INTERNAL TESTER RIGHT NOW? ==="
                if blockers.empty?
                  puts "  YES — build #{a["version"]} is VALID, not expired, export compliance answered" +
                       (ibs ? ", and internalBuildState is #{ibs}." : ".")
                  unknowns.each { |u| puts "    (unknown, not a blocker: #{u})" }
                else
                  puts "  NO. Blockers:"
                  blockers.each { |b| puts "    - #{b}" }
                  unknowns.each { |u| puts "    (unknown, not a blocker: #{u})" }
                end
              '
              ;;

            "answer-export-compliance")
              # The one blocker that is fixable from here. An unanswered usesNonExemptEncryption
              # holds a build in limbo indefinitely and shows nothing on a phone.
              # ⚠️ THIS IS NOT AN APP REVIEW SUBMISSION and changes no metadata, pricing or
              # availability — it answers one boolean Apple asks about every upload.
              if [ -z "${BUILD_NUMBER:-}" ]; then echo "::error::build number required"; exit 1; fi
              ruby -e '
                require "jwt"; require "net/http"; require "json"; require "uri"
                key_id    = ENV.fetch("APPLE_API_KEY_ID")
                issuer_id = ENV.fetch("APPLE_API_ISSUER_ID")
                pem       = File.read(File.expand_path("~/private_keys/AuthKey_#{key_id}.p8"))
                token = JWT.encode({ iss: issuer_id, exp: Time.now.to_i + 600, aud: "appstoreconnect-v1" },
                                   OpenSSL::PKey::EC.new(pem), "ES256", { kid: key_id, typ: "JWT" })
                def req!(m, path, token, payload = nil)
                  uri = URI("https://api.appstoreconnect.apple.com#{path}")
                  r = (m == :get ? Net::HTTP::Get : Net::HTTP::Patch).new(uri)
                  r["Authorization"] = "Bearer #{token}"; r["Content-Type"] = "application/json"
                  r.body = payload.to_json if payload
                  res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(r) }
                  [res.code.to_i, (JSON.parse(res.body) rescue { "raw" => res.body })]
                end
                app_id = ENV.fetch("ASC_APP_ID"); want = ENV.fetch("BUILD_NUMBER")
                _, body = req!(:get, "/v1/builds?filter[app]=#{app_id}&limit=20&sort=-uploadedDate", token)
                b = (body["data"] || []).find { |x| x.dig("attributes","version") == want }
                abort("build #{want} not found") if b.nil?
                if !b.dig("attributes","usesNonExemptEncryption").nil?
                  puts "Already answered: usesNonExemptEncryption = #{b.dig("attributes","usesNonExemptEncryption")}. Nothing to do."
                  exit 0
                end
                code, res = req!(:patch, "/v1/builds/#{b["id"]}", token,
                  { data: { type: "builds", id: b["id"], attributes: { usesNonExemptEncryption: false } } })
                puts "PATCH -> HTTP #{code}"
                puts "usesNonExemptEncryption now: #{res.dig("data","attributes","usesNonExemptEncryption").inspect}"
              '
              ;;

            "list-testers")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!

                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                puts "App: #{app.name} (#{app.id}) #{app.bundle_id}"
                puts ""

                groups = app.get_beta_groups
                puts "=== BETA GROUPS (#{groups.length}) ==="
                groups.each do |g|
                  kind = g.is_internal_group ? "INTERNAL" : "EXTERNAL"
                  puts "  #{g.name} — #{kind} — public link: #{g.public_link_enabled ? g.public_link : "off"}"
                end
                puts ""

                puts "=== TESTERS ==="
                testers = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id }, includes: "betaGroups")
                if testers.empty?
                  puts "  (none returned)"
                else
                  testers.each do |t|
                    name = [safe(t, :first_name), safe(t, :last_name)].compact.join(" ").strip
                    name = "(no name)" if name.empty?
                    gs = (safe(t, :beta_groups) || []).map { |g| safe(g, :name) }.compact
                    internal = (safe(t, :beta_groups) || []).any? { |g| safe(g, :is_internal_group) }
                    puts "  #{safe(t, :email)} — #{name} — invite: #{safe(t, :invite_type)} — " \
                         "#{internal ? "INTERNAL" : "external"} — groups: #{gs.empty? ? "-" : gs.join(", ")}"
                  end
                end
                puts ""
                puts "TOTAL TESTERS RETURNED: #{testers.length}"
                puts ""

                # ⚠️ BEING A TESTER AND THE BUILD BEING SHARED WITH THE GROUP ARE TWO DIFFERENT THINGS.
                puts "=== BUILDS, AND WHICH GROUPS THEY ARE SHARED WITH ==="
                builds = begin
                  Spaceship::ConnectAPI::Build.all(app_id: app.id, sort: "-uploadedDate", limit: 5)
                rescue StandardError => e
                  puts "  (could not list builds: #{e.class}: #{e.message})"
                  []
                end
                builds.each do |b|
                  shared = begin
                    b.get_beta_groups.map { |g| safe(g, :name) }.compact.join(", ")
                  rescue StandardError => e
                    "(could not read: #{e.class})"
                  end
                  shared = "NOT SHARED WITH ANY GROUP" if shared.to_s.strip.empty?
                  puts "  build #{safe(b, :version)} (v#{safe(b, :app_version)}) uploaded #{safe(b, :uploaded_date)} — " \
                       "processing: #{safe(b, :processing_state)} — expired: #{safe(b, :expired)} — groups: #{shared}"
                end
              '
              ;;

            "list-builds")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                Spaceship::ConnectAPI::Build.all(app_id: app.id, sort: "-uploadedDate", limit: 20).each do |b|
                  puts "build #{safe(b, :version)} (v#{safe(b, :app_version)}) — #{safe(b, :processing_state)} — " \
                       "uploaded #{safe(b, :uploaded_date)} — expired: #{safe(b, :expired)}"
                end
              '
              ;;

            "add-tester")
              if [ -z "${TESTER_EMAIL:-}" ]; then
                echo "::error::email required for add-tester"
                exit 1
              fi
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!

                email = ENV.fetch("TESTER_EMAIL")
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])

                # ⚠️ REFUSE TO CREATE A DUPLICATE. Check first, exactly as the brief asked.
                existing = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id, email: email })
                unless existing.empty?
                  t = existing.first
                  gs = (safe(t, :beta_groups) || []).map { |g| safe(g, :name) }.compact.join(", ")
                  puts "ALREADY A TESTER: #{email} — invite #{safe(t, :invite_type)} — groups: #{gs}. Nothing added."
                  exit 0
                end

                groups = app.get_beta_groups
                # ⚠️ PREFER INTERNAL — internal testers get builds immediately; external ones wait
                # on Beta App Review, which can take days.
                group = groups.find { |g| g.is_internal_group } || groups.first
                raise "no beta group on this app" if group.nil?
                puts "Adding #{email} to #{group.name} (#{group.is_internal_group ? "INTERNAL" : "EXTERNAL"})..."

                tester = Spaceship::ConnectAPI::BetaTester.create(
                  beta_group_id: group.id, email: email, first_name: "Roye", last_name: "Arguan"
                )
                puts "Added: #{email} to #{group.name}"

                after = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id, email: email })
                puts "Read back: #{after.map { |t| "#{safe(t, :email)} invite=#{safe(t, :invite_type)}" }.join(", ")}"
              '
              ;;

            "enable-public-link")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                groups = app.get_beta_groups
                external = groups.find { |g| !g.is_internal_group }
                raise "no external group — create one in App Store Connect first" if external.nil?
                external = external.update(attributes: { publicLinkEnabled: true, publicLinkLimitEnabled: false })
                puts "Public link enabled: #{external.public_link_enabled}"
                puts "Public link: #{external.public_link}"
              '
              ;;
          esac
