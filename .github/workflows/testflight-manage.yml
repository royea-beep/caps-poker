name: Manage TestFlight

# ⚠️ THIS WORKFLOW AUTHENTICATES WITH THE APP STORE CONNECT API KEY, NOT AN APPLE ID.
#
# It used to log in as royearguan@gmail.com with an app-specific password plus a cached
# FASTLANE_SESSION cookie. That path is DEAD and had never once succeeded: all four dispatches
# before 2026-09-07 failed, the last two with "Invalid username and password combination" and
# "The login credentials for 'royearguan@gmail.com' seem to be wrong". This is the expected end
# state for that mechanism — an app-specific password is revoked whenever the Apple ID password
# changes, and a FASTLANE_SESSION cookie expires after about a month regardless.
#
# Meanwhile every OTHER App Store Connect workflow in this repo — ios-testflight.yml,
# ios-testflight-free.yml, asc-submit.yml, asc-cert-audit.yml, asc-fetch-profile.yml,
# delete-asc-version.yml — has been using the API key all along, and it works: it uploaded build
# 514 on 2026-09-02. This file was simply the last one still on the old path.
#
# So the key setup step below is copied from ios-testflight.yml (its "Setup App Store Connect API
# key" step), and Spaceship::ConnectAPI.login(user) becomes .auth(key_id:, issuer_id:, filepath:).
# NO NEW SECRET IS NEEDED — APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_BASE64 already
# exist and are already proven.
#
# ⚠️ API-KEY AUTH CANNOT SEE OR CREATE **INTERNAL** TESTERS ON SOME ACCOUNT SETUPS, because an
# internal tester is an App Store Connect *user* rather than a plain email. list-testers therefore
# prints the beta GROUPS and says which are internal, so the report can be honest about what was
# and was not visible, instead of presenting an external-only list as if it were everything.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - list-testers
          - list-builds
          - add-tester
          - enable-public-link
      email:
        description: 'Tester email (for add-tester action)'
        required: false
        type: string

jobs:
  manage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane

      # Copied from ios-testflight.yml — the setup that is proven to work.
      - name: Setup App Store Connect API key
        env:
          API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -eu
          if [ -z "${API_KEY_ID:-}" ] || [ -z "${API_KEY_BASE64:-}" ]; then
            echo "::error::APPLE_API_KEY_ID / APPLE_API_KEY_BASE64 missing."
            exit 1
          fi
          mkdir -p ~/private_keys
          printf %s "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Run TestFlight management
        env:
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_IDENTIFIER: com.capspoker.app
          APPLE_TEAM_ID: 3K9KJNGL9U
          ASC_APP_ID: "6760429619"
          TESTER_EMAIL: ${{ github.event.inputs.email }}
        run: |
          set -eu
          ACTION="${{ github.event.inputs.action }}"

          # One shared auth preamble, so no action can accidentally use a different credential.
          cat > /tmp/asc_auth.rb <<'RUBY'
            require "spaceship"
            def asc_login!
              key_id    = ENV.fetch("APPLE_API_KEY_ID")
              issuer_id = ENV.fetch("APPLE_API_ISSUER_ID")
              path      = File.expand_path("~/private_keys/AuthKey_#{key_id}.p8")
              raise "missing #{path}" unless File.exist?(path)
              Spaceship::ConnectAPI.auth(key_id: key_id, issuer_id: issuer_id, filepath: path)
              puts "Authenticated to App Store Connect with API key #{key_id}."
            end
          RUBY

          case "$ACTION" in
            "list-testers")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!

                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                puts "App: #{app.name} (#{app.id}) #{app.bundle_id}"
                puts ""

                groups = app.get_beta_groups
                puts "=== BETA GROUPS (#{groups.length}) ==="
                groups.each do |g|
                  kind = g.is_internal_group ? "INTERNAL" : "EXTERNAL"
                  puts "  #{g.name} — #{kind} — public link: #{g.public_link_enabled ? g.public_link : "off"}"
                end
                puts ""

                puts "=== TESTERS ==="
                testers = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id }, includes: "betaGroups")
                if testers.empty?
                  puts "  (none returned)"
                else
                  testers.each do |t|
                    name = [t.first_name, t.last_name].compact.join(" ").strip
                    name = "(no name)" if name.empty?
                    gs = (t.beta_groups || []).map(&:name).join(", ")
                    puts "  #{t.email} — #{name} — state: #{t.state} — invite: #{t.invite_type} — groups: #{gs.empty? ? "-" : gs}"
                  end
                end
                puts ""
                puts "TOTAL TESTERS RETURNED: #{testers.length}"
                puts ""

                # ⚠️ BEING A TESTER AND THE BUILD BEING SHARED WITH THE GROUP ARE TWO DIFFERENT THINGS.
                puts "=== BUILDS, AND WHICH GROUPS THEY ARE SHARED WITH ==="
                builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, sort: "-uploadedDate", limit: 5)
                builds.each do |b|
                  shared = begin
                    b.get_beta_groups.map(&:name).join(", ")
                  rescue StandardError => e
                    "(could not read: #{e.class})"
                  end
                  shared = "NOT SHARED WITH ANY GROUP" if shared.to_s.strip.empty?
                  puts "  build #{b.version} (#{b.app_version}) uploaded #{b.uploaded_date} — processing: #{b.processing_state} — groups: #{shared}"
                end
              '
              ;;

            "list-builds")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                Spaceship::ConnectAPI::Build.all(app_id: app.id, sort: "-uploadedDate", limit: 20).each do |b|
                  puts "build #{b.version} (v#{b.app_version}) — #{b.processing_state} — uploaded #{b.uploaded_date} — expired: #{b.expired}"
                end
              '
              ;;

            "add-tester")
              if [ -z "${TESTER_EMAIL:-}" ]; then
                echo "::error::email required for add-tester"
                exit 1
              fi
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!

                email = ENV.fetch("TESTER_EMAIL")
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])

                # ⚠️ REFUSE TO CREATE A DUPLICATE. Check first, exactly as the brief asked.
                existing = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id, email: email })
                unless existing.empty?
                  puts "ALREADY A TESTER: #{email} — state #{existing.first.state}. Nothing added."
                  exit 0
                end

                groups = app.get_beta_groups
                # ⚠️ PREFER INTERNAL — internal testers get builds immediately; external ones wait
                # on Beta App Review, which can take days.
                group = groups.find { |g| g.is_internal_group } || groups.first
                raise "no beta group on this app" if group.nil?
                puts "Adding #{email} to #{group.name} (#{group.is_internal_group ? "INTERNAL" : "EXTERNAL"})..."

                tester = Spaceship::ConnectAPI::BetaTester.create(
                  beta_group_id: group.id, email: email, first_name: "Roye", last_name: "Arguan"
                )
                puts "Added: #{email} to #{group.name}"

                after = Spaceship::ConnectAPI::BetaTester.all(filter: { apps: app.id, email: email })
                puts "Read back: #{after.map { |t| "#{t.email} state=#{t.state}" }.join(", ")}"
              '
              ;;

            "enable-public-link")
              ruby -e '
                load "/tmp/asc_auth.rb"
                asc_login!
                app = Spaceship::ConnectAPI::App.find(ENV["APP_IDENTIFIER"])
                groups = app.get_beta_groups
                external = groups.find { |g| !g.is_internal_group }
                raise "no external group — create one in App Store Connect first" if external.nil?
                external = external.update(attributes: { publicLinkEnabled: true, publicLinkLimitEnabled: false })
                puts "Public link enabled: #{external.public_link_enabled}"
                puts "Public link: #{external.public_link}"
              '
              ;;
          esac
