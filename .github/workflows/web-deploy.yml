name: Web Deploy (Vercel)

# Builds Expo web bundle and deploys to caps.ftable.co.il via Vercel.
# Custom domain caps.ftable.co.il is aliased to the "dist" Vercel project
# (prj_Xs2oTTRhOc0AXKiiJhzy4dRo3juP) under team team_ayrePMw5z8jSPhRe67RiBD0k.
#
# Required secrets: EXPO_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Triggers on push to main or master ONLY. The deploy step below runs `vercel --prod`,
# which OVERRIDES the Vercel "Production Branch = main" setting — so ANY branch listed
# here can claim the production domain caps.ftable.co.il. Keep this list to main/master.
#
# HOTFIX PATH IS MERGE-TO-MAIN, NOT push-to-fix.
#
# History: fix/** was added to this trigger on 2026-06-15 (VAMOS-QA-LOOP) for a live
# auto-QA loop that deployed fix branches straight to caps.ftable.co.il. Removed
# 2026-07-19 after a fix/** push put UNMERGED code (fix/board-routing) live on the
# production domain via `vercel --prod`. Non-main QA now uses `qa/` PREVIEW deployments
# + a Protection Bypass token — never the production domain.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BZ1 — TYPECHECK ON CLEAN HARDWARE.
      # The dev machine has produced 21 tsc attempts across 7 sprints for 7 answers, and one
      # commit shipped with no verdict at all after four consecutive 0xC0000005 crashes. A
      # yes/no question should not depend on that machine's RAM.
      #
      # DELIBERATELY NON-BLOCKING. `exit 0` plus continue-on-error, belt and braces. Turning
      # this into a gate the same day it lands means the first false positive costs a deploy
      # we needed; blocking is a policy change and is Roye's call, not a side effect of adding
      # the check. Flip `exit 0` to `exit $code` when he approves it.
      #
      # Result goes to the JOB SUMMARY, not just the log — the summary renders on the run page
      # without expanding any step, which is the difference between a check that is read and a
      # check that is technically present.
      - name: TypeScript check (non-blocking)
        id: tsc
        continue-on-error: true
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json > tsc-output.txt 2>&1
          code=$?
          set -e
          count=$(grep -c "error TS" tsc-output.txt || true)
          if [ "$code" -eq 0 ]; then
            echo "## TypeScript: clean" >> "$GITHUB_STEP_SUMMARY"
            echo "\`tsc --noEmit\` found no errors on CI hardware." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## TypeScript: ${count} error(s) — NOT blocking this deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -40 tsc-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Full output in the \`tsc-output\` artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload tsc output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: tsc-output.txt
          if-no-files-found: ignore

      # CN-CAPTURE 2026-08-08 — the probe harness (utils/devRevealFixture.ts) can substitute
      # revealData and publish internals. It is guarded by `__DEV__ ||
      # EXPO_PUBLIC_CAPS_FIXTURE === '1'`. `__DEV__` cannot be switched on in a release build,
      # but an env var CAN: one copy-pasted build command would ship a bundle where game state
      # is overridable from the page.
      #
      # With the variable UNSET, the minifier folds the guard and emits an unconditional early
      # `return` — measured on a real export, the fixture branch is statically unreachable. That
      # is exactly why this gate exists: the protection is a property of the BUILD ENVIRONMENT,
      # not of the source, so it has to be asserted where the build happens.
      #
      # BLOCKING on purpose, unlike the tsc check above: this is not a quality signal, it is the
      # difference between shipping a debug backdoor and not.
      - name: Assert probe harness is disabled
        run: |
          if [ -n "$EXPO_PUBLIC_CAPS_FIXTURE" ]; then
            echo "::error::EXPO_PUBLIC_CAPS_FIXTURE is set ('$EXPO_PUBLIC_CAPS_FIXTURE') — that ships the revealData fixture override. It must never be set on a release build."
            exit 1
          fi
          echo "EXPO_PUBLIC_CAPS_FIXTURE unset — probe harness will be compiled out."

      - name: Export Expo web bundle
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=8192'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo export --platform web --output-dir dist --clear

      # Artifact-side observation, INFORMATIONAL ONLY — never blocks.
      # The symbol string does survive minification (it sits after the folded `return`), so
      # "is it present" cannot distinguish dead from live. Deciding that from CI would mean
      # pattern-matching minified identifiers, which change build to build — a gate that fails
      # for the wrong reason costs a deploy we needed. The environment assertion above is the
      # real protection; this just records what shipped.
      - name: Report fixture symbol in bundle (informational)
        continue-on-error: true
        run: |
          if grep -rlq '__CAPS_REVEAL_FIXTURE__' dist/_expo/static/js/web/ 2>/dev/null; then
            echo "note: fixture symbol present in bundle (expected — it follows a folded early return)." >> $GITHUB_STEP_SUMMARY
          else
            echo "note: fixture symbol fully stripped from bundle." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Patch index.html + write vercel.json
        run: node scripts/fix-web-html.js

      - name: Deploy to Vercel (production)
        working-directory: dist
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --yes --token "$VERCEL_TOKEN"

      # Wait for the new prod build to be live before auditing it.
      # Vercel alias propagation is usually < 30s after the deploy command returns.
      - name: Wait for caps.ftable.co.il to serve new SHA
        run: sleep 45

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap storageState
        env:
          CAPS_URL: 'https://caps.ftable.co.il'
        run: node tests/bootstrap-storage-state.js

      - name: WCAG audit (axe-core) — fail on critical
        env:
          CAPS_URL: 'https://caps.ftable.co.il'
        run: node tests/wcag-audit.js

      - name: Upload WCAG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-report
          path: tests/wcag-report.json
          if-no-files-found: ignore

      # BackstopJS gate is currently non-blocking. The committed reference
      # bitmaps were captured on a Windows host, the CI runner is Ubuntu, and
      # cross-platform font/anti-aliasing differences alone push every scenario
      # over the 0.5% threshold. To make this a hard gate, re-baseline on
      # Linux via the dispatch workflow `backstop-baseline.yml`, commit the
      # refreshed `backstop_data/bitmaps_reference/`, and flip continue-on-error
      # to false (or remove it).
      - name: BackstopJS visual regression
        continue-on-error: true
        env:
          CAPS_URL: 'https://caps.ftable.co.il'
        run: npx backstop test

      - name: Upload BackstopJS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstop-report
          path: |
            backstop_data/bitmaps_test
            backstop_data/html_report
            backstop_data/ci_report
          if-no-files-found: ignore