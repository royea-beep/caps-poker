name: Restore Signing Vault (manual, disaster recovery)

# ============================================================================
# WHAT THIS RECOVERS
#
# The Apple signing material for BOTH projects: 4 x distribution certificate
# (.p12 + its password) + provisioning profile, for CAPS and Wingman, plus
# Wingman's ASC API key. 13 files. Without these, neither app can be built or
# submitted, and replacements can only be issued from Apple directly -- there is
# no Expo account any more (see MEMORY.md).
#
# HOW THE BACKUP IS STORED
#   Copy 1  local disk        C:\Projects\_KEYS\SIGNING-RESCUE-2026-08-06
#   Copy 2  GitHub Secrets    SIGNING_VAULT_2026_08_06  (base64 of a gpg AES256 archive)
#                           + SIGNING_VAULT_PASSPHRASE  (machine-generated, 48 chars)
#
# WHY DECRYPTING IN CI IS ACCEPTABLE HERE
#
# An earlier version of this workflow deliberately did NOT decrypt, because the
# passphrase was the owner's and putting it in CI would have exposed a human
# secret. That is no longer true: the passphrase is machine-generated, exists
# nowhere but this repository's secret store, and protects nothing else. Both
# halves already live in the same trust boundary, so decrypting here adds no new
# exposure -- and it removes every manual step from the recovery, which is the
# whole point of this design.
#
# The residual risk this creates is deliberate and recorded: anyone who can
# dispatch workflows on this repo can obtain the signing keys. That is the same
# population that can already push code which gets signed with them.
#
# RECOVERY: four steps, no local tooling, nothing to remember.
#   1. Actions -> "Restore Signing Vault" -> Run workflow
#   2. Download the `signing-vault-restored` artifact
#   3. The files are ALREADY DECRYPTED -- just unzip
#   4. The artifact self-destructs after 1 day
# ============================================================================

on:
  workflow_dispatch:        # MANUAL ONLY. Never on push, never scheduled.

permissions:
  contents: read            # minimal token; no write access needed

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and decrypt the vault (neither secret is ever printed)
        env:
          # Both secrets are read via env rather than interpolated into the command
          # line: a command line can surface in process listings and error traces.
          # Neither value is echoed, cat-ed, or exposed to `set -x`.
          VAULT_B64: ${{ secrets.SIGNING_VAULT_2026_08_06 }}
          VAULT_PASS: ${{ secrets.SIGNING_VAULT_PASSPHRASE }}
        run: |
          set -eu                       # deliberately NOT -x

          if [ -z "${VAULT_B64:-}" ]; then
            echo "::error::Secret SIGNING_VAULT_2026_08_06 is missing or empty."
            echo "::error::Failing instead of uploading an empty artifact, which would look like a successful restore."
            exit 1
          fi
          if [ -z "${VAULT_PASS:-}" ]; then
            echo "::error::Secret SIGNING_VAULT_PASSPHRASE is missing or empty."
            echo "::error::The archive cannot be decrypted. Failing rather than uploading something unopenable."
            exit 1
          fi

          printf '%s' "$VAULT_B64" | base64 -d > vault.tar.gz.gpg
          BYTES=$(stat -c%s vault.tar.gz.gpg)
          if [ "$BYTES" -lt 1024 ]; then
            echo "::error::Decoded archive is only ${BYTES} bytes - implausibly small; refusing to continue."
            exit 1
          fi
          # SHA256 of the ENCRYPTED archive is not secret, and is the integrity check:
          # compare against the value recorded in MEMORY.md.
          echo "encrypted bytes : ${BYTES}"
          echo "encrypted sha256: $(sha256sum vault.tar.gz.gpg | cut -d' ' -f1)"

          # Passphrase via file descriptor, never as an argv element.
          mkdir -p restored
          printf '%s' "$VAULT_PASS" | \
            gpg --batch --yes --quiet --pinentry-mode loopback \
                --passphrase-fd 0 --decrypt -o vault.tar.gz vault.tar.gz.gpg

          tar -xzf vault.tar.gz -C restored
          COUNT=$(find restored -type f | wc -l)
          echo "restored files  : ${COUNT}"
          if [ "$COUNT" -lt 13 ]; then
            echo "::error::Expected 13 files, got ${COUNT}. Refusing to upload a partial vault."
            exit 1
          fi
          # Names only - never contents.
          find restored -type f -printf '  %f (%s bytes)\n' | sort

          rm -f vault.tar.gz vault.tar.gz.gpg

      - name: Upload the restored vault
        uses: actions/upload-artifact@v4
        with:
          name: signing-vault-restored
          path: restored/
          retention-days: 1     # short on purpose: long enough to download, not to linger
          if-no-files-found: error
