name: iOS Simulator Smoke Test

# Fully-automated visual QA. Builds the iOS app for the Simulator architecture
# (free, no signing, no EAS cloud quota), boots an iPhone simulator on the
# macos-15 runner, installs the .app, runs a deep-link tour of every meaningful
# screen, captures one screenshot per screen + a single mp4 of the full flow,
# then uploads everything to Supabase Storage so the gallery is one URL to share.
#
# Trigger: workflow_dispatch (manual) + auto on push to main when relevant files change.
#
# Notes:
#  - Game-flow inside /game (place 16 cards -> ready -> reveal -> results) cannot
#    be fully driven without an XCUITest target or a debug auto-play deep-link.
#    We capture the static placement state (initial 16 cards in hand, boards
#    prefilled by the bot) and document the limitation. A follow-up PR can add
#    `caps-poker://game?demo=1` to trigger an auto-play demo inside the app.
#  - The crash-grep used to false-positive on the `log stream` predicate echo
#    ("Filtering the log data..."). Fixed by `grep -v` on that line.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'store/**'
      - 'utils/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/ios-simulator-smoke.yml'

concurrency:
  group: ios-simulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build .app + simulator tour + Supabase upload
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE_PATH" ] && { echo "::error::No Xcode"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build .app for Simulator (local, no signing, no EAS cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # CI flag: components/_layout read this and skip overlays / push prompt so
          # deep-link navigation in the tour isn't blocked by modals.
          EXPO_PUBLIC_CAPS_CI: '1'
        run: |
          eas build \
            --platform ios \
            --profile simulator \
            --non-interactive \
            --local \
            --output "$RUNNER_TEMP/CapsPoker.tar.gz"

          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/CapsPoker.tar.gz" -C "$RUNNER_TEMP/app"
          APP_PATH=$(find "$RUNNER_TEMP/app" -name "*.app" -type d | head -1)
          [ -z "$APP_PATH" ] && { echo "::error::No .app found"; ls -la "$RUNNER_TEMP/app"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | \
            grep -E "iPhone 1[567] Pro" | grep -v unavailable | head -1 | \
            grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}")
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | \
            grep iPhone | grep -v unavailable | head -1 | \
            grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}")
          [ -z "$UDID" ] && { echo "::error::No simulator available"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Booting $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install .app + extract bundle id
        run: |
          xcrun simctl install "$UDID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Installed: $BUNDLE_ID"

      - name: Start system log capture (crash detection)
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "$UDID" log stream \
            --predicate "subsystem == 'com.apple.crashreporter' OR processImagePath CONTAINS 'CapsPoker'" \
            --style syslog > artifacts/simulator.log 2>&1 &
          echo "LOG_PID=$!" >> "$GITHUB_ENV"
          sleep 1

      - name: Start screen recording (single mp4 for the whole tour)
        run: |
          xcrun simctl io "$UDID" recordVideo --codec=h264 artifacts/full-tour.mp4 &
          echo "REC_PID=$!" >> "$GITHUB_ENV"
          sleep 1

      - name: Launch app + run deep-link screen tour
        run: |
          set +e

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 10

          shot() {
            local tag="$1"
            local delay="${2:-3}"
            sleep "$delay"
            xcrun simctl io "$UDID" screenshot "artifacts/${tag}.png" 2>/dev/null
            local size=$(stat -f%z "artifacts/${tag}.png" 2>/dev/null || echo 0)
            echo "screenshot ${tag}.png (${size} bytes)"
          }

          deeplink() {
            xcrun simctl openurl "$UDID" "caps-poker://$1"
          }

          xcrun simctl ui "$UDID" appearance light 2>/dev/null || true

          shot "01_home_initial_light" 3

          deeplink ""        ; shot "02_home_light"        3
          deeplink "play"    ; shot "03_play_tab_light"    3
          deeplink "cups"    ; shot "04_cups_tab_light"    3
          deeplink "friends" ; shot "05_friends_tab_light" 3
          deeplink "profile" ; shot "06_profile_tab_light" 3

          # Static initial /game state (no demo) - 16 cards in hand, boards prefilled by bot
          deeplink "game"    ; shot "10_game_static_light"   4

          # Demo deep-link drives the full flow: auto-fill at +2s, auto-ready at +4s,
          # bot reveal animation ~+5-7s, results lands ~+9s. Use simctl launch with
          # URL as an arg instead of openurl, to bypass the iOS "Open in App?" prompt
          # that blocked the previous run (caps-sim-auto-8-1).
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" "caps-poker://game?demo=1"
          shot "12_demo_t0_placement_light"  3   # 16 cards in hand, bot prefilled
          shot "13_demo_t3_filled_light"     2   # right after auto-fill - all 16 placed
          shot "14_demo_t5_ready_light"      2   # right after auto-ready - reveal starting
          shot "15_demo_t7_reveal_light"     2   # mid-reveal - bot cards flipping
          shot "16_demo_t9_results_light"    3   # results screen - winners + chip delta

          deeplink "settings"     ; shot "20_settings_light"      3
          deeplink "leaderboard"  ; shot "21_leaderboard_light"   3
          deeplink "hand-history" ; shot "22_hand_history_light"  3
          deeplink "achievements" ; shot "23_achievements_light"  3
          deeplink "missions"     ; shot "24_missions_light"      3
          deeplink "battle-pass"  ; shot "25_battle_pass_light"   3
          deeplink "shop"         ; shot "26_shop_light"          3
          deeplink "chip-store"   ; shot "27_chip_store_light"    3
          deeplink "stats"        ; shot "28_stats_light"         3
          deeplink "rank"         ; shot "29_rank_light"          3
          deeplink "tournament"   ; shot "30_tournament_light"    3
          deeplink "quick-poker"  ; shot "31_quick_poker_light"   3
          deeplink "play-of-day"  ; shot "32_play_of_day_light"   3
          deeplink "coaching"     ; shot "33_coaching_light"      3
          deeplink "referral"     ; shot "34_referral_light"      3
          deeplink "results"      ; shot "35_results_light"       3
          deeplink "heatmap"      ; shot "36_heatmap_light"       3

          xcrun simctl ui "$UDID" appearance dark 2>/dev/null || true
          deeplink ""        ; shot "50_home_dark"          3
          deeplink "game"    ; shot "51_game_dark"          4
          deeplink "settings"; shot "52_settings_dark"      3
          deeplink "profile" ; shot "53_profile_dark"       3

          xcrun simctl ui "$UDID" appearance light 2>/dev/null || true
          deeplink "" ; shot "99_home_final_light" 4

          echo "Total screenshots:"
          ls artifacts/*.png 2>/dev/null | wc -l

      - name: Stop recording + log stream
        if: always()
        run: |
          [ -n "$REC_PID" ] && kill -INT "$REC_PID" 2>/dev/null || true
          [ -n "$LOG_PID" ] && kill "$LOG_PID" 2>/dev/null || true
          sleep 3
          ls -la artifacts/ | head -50

      - name: Crash detection (CapsPoker-scoped, predicate-echo filtered)
        if: always()
        run: |
          FILTERED=$(grep -v "Filtering the log data" artifacts/simulator.log 2>/dev/null || true)

          if echo "$FILTERED" | grep -E "(CapsPoker\[[0-9]+\]:.*(SIGABRT|EXC_BAD|abort\(\)|crashed|Hermes assertion failure))|(com\.apple\.crashreporter.*CapsPoker)|ReportCrash.*CapsPoker" > /dev/null 2>&1; then
            echo "::error::CapsPoker crash detected - see simulator.log artifact + Supabase folder"
            echo "$FILTERED" | grep -E "(CapsPoker\[[0-9]+\]:.*(SIGABRT|EXC_BAD|abort\(\)|crashed|Hermes assertion failure))|(com\.apple\.crashreporter.*CapsPoker)|ReportCrash.*CapsPoker" | head -10
            CRASH_FOUND=1
          else
            echo "No CapsPoker-scoped crash patterns detected"
            CRASH_FOUND=0
          fi
          echo "CRASH_FOUND=$CRASH_FOUND" >> "$GITHUB_ENV"

      - name: Upload to Supabase Storage (auto-tour gallery)
        if: always()
        env:
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          FOLDER="caps-sim-auto-${{ github.run_number }}-${{ github.run_attempt }}"
          BASE="${SB_URL}/storage/v1/object/screenshots"
          PUBLIC_BASE="${SB_URL}/storage/v1/object/public/screenshots"
          UPLOADED=0
          FAILED=0

          for f in artifacts/*.png artifacts/full-tour.mp4 artifacts/simulator.log; do
            [ -e "$f" ] || continue
            NAME=$(basename "$f")
            CTYPE="application/octet-stream"
            case "$NAME" in
              *.png) CTYPE="image/png" ;;
              *.mp4) CTYPE="video/mp4" ;;
              *.log) CTYPE="text/plain" ;;
            esac

            HTTP=$(curl -s -o /tmp/upload-resp -w "%{http_code}" \
              -X POST "${BASE}/${FOLDER}/${NAME}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "apikey: ${SB_KEY}" \
              -H "Content-Type: ${CTYPE}" \
              -H "x-upsert: true" \
              --data-binary "@${f}")

            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
              UPLOADED=$((UPLOADED+1))
              echo "OK ${NAME} -> ${PUBLIC_BASE}/${FOLDER}/${NAME}"
            else
              FAILED=$((FAILED+1))
              echo "FAIL ${NAME} (HTTP ${HTTP}): $(cat /tmp/upload-resp | head -c 200)"
            fi
          done

          echo "SUPABASE_FOLDER=${FOLDER}" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLIC_BASE=${PUBLIC_BASE}" >> "$GITHUB_ENV"
          echo "UPLOAD_OK=${UPLOADED}" >> "$GITHUB_ENV"
          echo "UPLOAD_FAIL=${FAILED}" >> "$GITHUB_ENV"

      - name: Upload artifacts (GitHub Actions fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke-${{ github.run_number }}
          path: artifacts/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "# iOS Simulator Auto-Tour"
            echo ""
            echo "- App: \`$BUNDLE_ID\`"
            echo "- Simulator UDID: \`$UDID\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Screenshots uploaded: **${UPLOAD_OK:-0}** (failed: ${UPLOAD_FAIL:-0})"
            echo "- Crash detected: $([ \"${CRASH_FOUND:-0}\" = \"1\" ] && echo \"YES\" || echo \"No\")"
            echo ""
            echo "## Supabase gallery"
            echo ""
            if [ -n "$SUPABASE_FOLDER" ]; then
              echo "**Folder:** \`$SUPABASE_FOLDER\`"
              echo ""
              echo "Full mp4 (the whole tour, captures animations):"
              echo ""
              echo "\`\`\`"
              echo "${SUPABASE_PUBLIC_BASE}/${SUPABASE_FOLDER}/full-tour.mp4"
              echo "\`\`\`"
              echo ""
              echo "## Screenshot index"
              echo ""
              for f in artifacts/*.png; do
                [ -e "$f" ] || continue
                NAME=$(basename "$f")
                SIZE=$(stat -f%z "$f" 2>/dev/null || echo 0)
                echo "- [\`${NAME}\`](${SUPABASE_PUBLIC_BASE}/${SUPABASE_FOLDER}/${NAME}) - ${SIZE} bytes"
              done
            else
              echo "_(Supabase upload step did not produce a folder name - check logs.)_"
            fi
            echo ""
            echo "## Limitations / follow-up"
            echo ""
            echo "Game-flow interior states (placement -> ready -> reveal -> results)"
            echo "need an XCUITest target or a debug auto-play deep link (e.g."
            echo "\`caps-poker://game?demo=1\`) to drive the cards. Today we capture the"
            echo "initial /game placement state only. Add the demo deep-link in a future"
            echo "PR and the tour will pick up the full flow with no workflow change."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Fail the workflow if a crash was detected
        if: always()
        run: |
          if [ "${CRASH_FOUND:-0}" = "1" ]; then
            echo "::error::CapsPoker crash signature found in simulator log"
            exit 1
          fi
