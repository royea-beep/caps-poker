name: Backstop Baseline (Linux)

# Manually invoked job that captures BackstopJS reference bitmaps on the
# Ubuntu runner — the same OS the visual-regression gate runs on — so the
# committed baseline matches CI font/anti-aliasing. Invoke after intentional
# UI changes that shift pixel output.
#
# Usage:
#   1. gh workflow run backstop-baseline.yml
#   2. Workflow runs `npx backstop reference` against caps.ftable.co.il and
#      PUSHES the refreshed bitmaps to `qa/backstop-baseline-refresh`.
#   3. Open a PR from that branch and merge it to update the gate baseline.
#
# WHY IT PUSHES INSTEAD OF OPENING THE PR (2026-08-27). The final step used to call
# peter-evans/create-pull-request, and it failed every time with "GitHub Actions is not permitted
# to create or approve pull requests" — a repository setting, not a bug in this file. Both runs
# this workflow has ever had died there, including 2026-08-09, so the capture half has never
# actually delivered a baseline on its own. Enabling that setting would also work, but a setting
# is the repo owner's to change, and pushing the branch needs no permission beyond `contents:
# write`, which this job already holds. Human review is preserved either way: the reviewer opens
# the PR from the pushed branch and looks at the bitmaps before merging. That review is the whole
# point — a baseline commit is a declaration that these pixels are CORRECT, and a 404 page nearly
# became the definition of correct two sprints ago.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: >-
          Scenario label to recapture, e.g. `home`. Leave empty to recapture ALL of them.
          Regenerating every baseline at once forces a reviewer to re-approve screens that did not
          change, so a targeted recapture is the normal case and the full sweep is the exception.
        required: false
        default: ''

jobs:
  rebaseline:
    name: Capture Linux baseline + push branch
    runs-on: ubuntu-latest
    permissions:
      # `pull-requests: write` was dropped with the create-pull-request step — this job pushes a
      # branch and nothing more, and the token should not carry a scope the job cannot use.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap storageState
        env:
          CAPS_URL: 'https://caps.ftable.co.il'
        run: node tests/bootstrap-storage-state.js

      - name: Capture BackstopJS reference bitmaps
        env:
          CAPS_URL: 'https://caps.ftable.co.il'
          FILTER: ${{ inputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            echo "Recapturing only: $FILTER"
            npx backstop reference --filter="$FILTER"
          else
            echo "Recapturing ALL scenarios"
            npx backstop reference
          fi

      - name: Push refreshed baselines to a branch
        env:
          BRANCH: qa/backstop-baseline-refresh
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths only — a bare `git add -A` on a runner would sweep in node_modules,
          # backstop's html_report and the freshly captured bitmaps_test output, none of which
          # belong in the baseline commit.
          git add backstop_data/bitmaps_reference tests/caps-onboarded.json
          if git diff --cached --quiet; then
            echo "No baseline changed — nothing to push."
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m "chore(qa): refresh BackstopJS baselines (Linux capture)"
          git push --force-with-lease origin "$BRANCH"
          echo "::notice::Baselines pushed to $BRANCH — open a PR from it and review the bitmaps before merging."
          echo "Baselines pushed to $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Open a PR from that branch and LOOK at the bitmaps before merging." >> "$GITHUB_STEP_SUMMARY"
