name: One-time signing bootstrap

on:
  workflow_dispatch:
    inputs:
      p12_password:
        description: 'Password to encrypt the .p12 with (caller provides; never logged)'
        required: true
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Apple ASC API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"

      - name: Mask password
        env:
          PW: ${{ inputs.p12_password }}
        run: echo "::add-mask::$PW"

      - name: Run signing bootstrap
        env:
          APPLE_API_KEY_PATH:  ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.capspoker.app
          TEAM_ID: 3K9KJNGL9U
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: node scripts/bootstrap-signing.js

      - name: Cleanup key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"