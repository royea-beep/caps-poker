name: One-time signing bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Apple ASC API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"

      - name: Run signing bootstrap
        env:
          APPLE_API_KEY_PATH:  ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUNDLE_ID: com.capspoker.app
          TEAM_ID: 3K9KJNGL9U
        run: |
          # WARNING: password is intentionally NOT masked so we can capture it.
          # This run + this workflow file are deleted immediately after capture.
          P12_PASSWORD=$(openssl rand -base64 24 | tr -d '/=+' | head -c 32)
          export P12_PASSWORD
          node scripts/bootstrap-signing.js
          echo
          echo "=== P12_PASSWORD_VALUE_START ==="
          echo "$P12_PASSWORD"
          echo "=== P12_PASSWORD_VALUE_END ==="

      - name: Cleanup key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"