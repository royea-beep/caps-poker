name: iOS TestFlight

# FREE build on GitHub-hosted macOS runner — zero EAS cloud charges
# Previous approach: ubuntu-latest + eas build --platform ios --non-interactive (paid EAS cloud)
# New approach: macos-15 + expo prebuild + xcodebuild (same pattern as 9Soccer-Mascots)
#
# Secrets required (existing secrets reused — no new secrets needed):
#   EXPO_TOKEN                    — Expo account token (needed for expo prebuild + build number sync)
#   APPLE_API_KEY_BASE64          — Base64 of AuthKey_HH732W7XQJ.p8 (ASC API key)
#   APPLE_API_KEY_ID              — HH732W7XQJ
#   APPLE_API_ISSUER_ID           — 686f97b8-3f8a-40b7-a6cd-5293a3168439
#   EXPO_PUBLIC_SUPABASE_URL      — https://gxrpunvhjcrzqnitbqah.supabase.co
#   EXPO_PUBLIC_SUPABASE_ANON_KEY — Supabase anon key (injected at build time)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --prefer-offline=false

      - name: Setup EAS (build number sync + prebuild credentials)
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Sync build number from EAS remote (increment + store)
        id: build_number
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Get current remote buildNumber, increment, write back to EAS remote
          RAW=$(eas build:version:get --platform ios --profile production --non-interactive --json 2>/dev/null || echo '{"buildNumber":"448"}')
          CURRENT=$(echo "$RAW" | node -e "process.stdin.setEncoding('utf8');let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.buildNumber||j.ios?.buildNumber||'448')}catch(e){console.log('448')}})")
          NEXT=$((CURRENT + 1))
          echo "BUILD_NUMBER=$NEXT" >> $GITHUB_ENV
          echo "build_number=$NEXT" >> $GITHUB_OUTPUT
          echo "Current: $CURRENT → Next: $NEXT"
          # Write the new build number back to EAS so it stays in sync
          eas build:version:set --platform ios --profile production --buildNumber "$NEXT" --non-interactive 2>/dev/null || echo "Version set skipped (non-blocking)"

      - name: Setup App Store Connect API key
        env:
          API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Setup signing (manual cert + provisioning profile)
        env:
          P12_BASE64:     ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD:   ${{ secrets.BUILD_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          # 1. Create a temp keychain dedicated to this run.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW=$(openssl rand -base64 24 | tr -d '/=+' | head -c 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # 2. Import the Distribution .p12 from secrets.
          P12="$RUNNER_TEMP/build.p12"
          printf %s "$P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"

          # 3. Make the new keychain the default search list (existing
          # login keychain stays available so cocoapods etc. still work).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Grant codesign access without UI prompts.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # 4. Install the provisioning profile.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf %s "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/caps-build.mobileprovision"

          # 5. Sanity check — verify codesign identity is visible.
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Register App ID via ASC API
        env:
          API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          node - << 'SCRIPT'
          const fs = require('fs')
          const https = require('https')
          const { createSign } = require('crypto')
          const keyId = process.env.API_KEY_ID
          const issuerId = process.env.API_ISSUER_ID
          const keyPath = `${process.env.HOME}/private_keys/AuthKey_${keyId}.p8`
          const privateKey = fs.readFileSync(keyPath, 'utf8')
          const header  = Buffer.from(JSON.stringify({ alg: 'ES256', kid: keyId, typ: 'JWT' })).toString('base64url')
          const now     = Math.floor(Date.now() / 1000)
          const payload = Buffer.from(JSON.stringify({ iss: issuerId, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' })).toString('base64url')
          const signer  = createSign('SHA256')
          signer.update(`${header}.${payload}`)
          const sig   = signer.sign({ key: privateKey, dsaEncoding: 'ieee-p1363' }, 'base64url')
          const token = `${header}.${payload}.${sig}`
          const data = JSON.stringify({ data: { type: 'bundleIds', attributes: {
            name: 'Caps Poker', identifier: 'com.capspoker.app', platform: 'IOS', seedId: '3K9KJNGL9U'
          }}})
          const req = https.request({
            hostname: 'api.appstoreconnect.apple.com', path: '/v1/bundleIds', method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data) }
          }, res => {
            let body = ''
            res.on('data', d => body += d)
            res.on('end', () => {
              if (res.statusCode === 201) console.log('Bundle ID com.capspoker.app registered!')
              else if (res.statusCode === 409) console.log('Bundle ID already exists — OK')
              else { console.log('ASC response', res.statusCode, body.slice(0, 200)); process.exit(0) }
            })
          })
          req.on('error', e => { console.log('ASC API error (non-fatal):', e.message); process.exit(0) })
          req.write(data)
          req.end()
          SCRIPT

      - name: Expo Prebuild — generate native iOS project
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --clean --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>3K9KJNGL9U</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.capspoker.app</key>
              <string>Caps Poker App Store (Manual)</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build & archive
        env:
          SIGN_IDENTITY:  ${{ secrets.BUILD_CERT_CN }}
          PROFILE_NAME:   ${{ secrets.BUILD_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -workspace ios/CapsPoker.xcworkspace \
            -scheme CapsPoker \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CapsPoker.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3K9KJNGL9U \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }} \
            MARKETING_VERSION=2.0.1

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CapsPoker.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Upload to TestFlight
        env:
          API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # altool expects the key at ~/.appstoreconnect/private_keys/
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/private_keys/AuthKey_${API_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          IPA_FILE=$(find $RUNNER_TEMP/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_FILE"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Distribute to all beta groups via ASC API
        env:
          KEY_ID:               ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID:            ${{ secrets.APPLE_API_ISSUER_ID }}
          PRIVATE_KEY:          ${{ secrets.APPLE_API_KEY_BASE64 }}
          TARGET_BUILD_VERSION: ${{ env.BUILD_NUMBER }}
        run: |
          python3 -m venv /tmp/asc-venv
          /tmp/asc-venv/bin/pip install PyJWT cryptography requests --quiet
          /tmp/asc-venv/bin/python3 << 'PYEOF'
          import jwt, time, requests, os, sys, base64

          KEY_ID               = os.environ['KEY_ID']
          ISSUER_ID            = os.environ['ISSUER_ID']
          PRIVATE_KEY          = base64.b64decode(os.environ['PRIVATE_KEY']).decode('utf-8')
          TARGET_BUILD_VERSION = os.environ.get('TARGET_BUILD_VERSION', '')
          BASE_URL             = 'https://api.appstoreconnect.apple.com/v1'

          print(f'Targeting build version: {TARGET_BUILD_VERSION}')

          def make_token():
              now = int(time.time())
              payload = {'iss': ISSUER_ID, 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'}
              return jwt.encode(payload, PRIVATE_KEY, algorithm='ES256', headers={'kid': KEY_ID})

          def hdrs():
              token = make_token()
              if isinstance(token, bytes):
                  token = token.decode()
              return {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          # 1. Find the app by bundle ID
          r = requests.get(f'{BASE_URL}/apps?filter[bundleId]=com.capspoker.app&limit=1', headers=hdrs())
          apps = r.json().get('data', [])
          if not apps:
              print('App not found in ASC — skipping distribution step')
              sys.exit(0)
          APP_ID = apps[0]['id']
          print(f'App found: {APP_ID}')

          # 2. Poll specifically for TARGET_BUILD_VERSION to reach VALID state (max 45 min)
          # IMPORTANT: filter by version number — never pick up a stale VALID build from a previous run
          print(f'Waiting for build {TARGET_BUILD_VERSION} to become VALID in ASC...')
          build_id = None
          build_version = None
          for attempt in range(45):
              time.sleep(60)
              r = requests.get(
                  f'{BASE_URL}/builds',
                  headers=hdrs(),
                  params={'filter[app]': APP_ID, 'sort': '-uploadedDate', 'limit': 10},
              )
              print(f'Attempt {attempt+1}/45 — API status={r.status_code}')
              if r.status_code == 200:
                  data = r.json().get('data', [])
                  for build in data:
                      state   = build['attributes'].get('processingState', '')
                      version = build['attributes'].get('version', '?')
                      print(f'  Build version={version} processingState={state}')
                      # Only accept the specific build version we just uploaded
                      if version == TARGET_BUILD_VERSION:
                          if state == 'VALID':
                              build_id      = build['id']
                              build_version = version
                              print(f'Build VALID — id={build_id}, version={version}')
                          elif state == 'INVALID':
                              print('::error::Build is INVALID (rejected by Apple). Check bundle ID, provisioning profile, and entitlements.')
                              sys.exit(1)
                          else:
                              print(f'  Build {version} still processing ({state}) — waiting...')
                          break  # Found our target — stop scanning other builds
                  if build_id:
                      break
              elif r.status_code in (401, 403):
                  print(f'::error::ASC API auth failed ({r.status_code}): {r.text[:300]}')
                  sys.exit(1)
              else:
                  print(f'  Response body: {r.text[:200]}')

          if not build_id:
              print('::warning::Build did not become VALID within 45 minutes. Add to groups manually in ASC.')
              sys.exit(0)

          # 3. Find or create an EXTERNAL beta group
          r = requests.get(f'{BASE_URL}/apps/{APP_ID}/betaGroups', headers=hdrs(), params={'limit': 50})
          r.raise_for_status()
          all_groups = r.json().get('data', [])
          external_groups = [g for g in all_groups if not g['attributes'].get('isInternalGroup', True)]
          print(f'Found {len(all_groups)} total group(s), {len(external_groups)} external group(s)')

          if not external_groups:
              print('No external beta group found — creating "CI Testers" group...')
              cr = requests.post(
                  f'{BASE_URL}/betaGroups',
                  headers=hdrs(),
                  json={'data': {
                      'type': 'betaGroups',
                      'attributes': {'name': 'CI Testers', 'publicLinkEnabled': False, 'feedbackEnabled': True},
                      'relationships': {'app': {'data': {'type': 'apps', 'id': APP_ID}}}
                  }}
              )
              if cr.status_code in (200, 201):
                  new_group = cr.json()['data']
                  external_groups = [new_group]
                  new_gid = new_group['id']
                  print(f'  Created external group: CI Testers ({new_gid})')
                  tr = requests.post(
                      f'{BASE_URL}/betaTesters',
                      headers=hdrs(),
                      json={'data': {
                          'type': 'betaTesters',
                          'attributes': {'email': 'royearguan@gmail.com', 'firstName': 'Roye', 'lastName': 'Arguan'},
                          'relationships': {'betaGroups': {'data': [{'type': 'betaGroups', 'id': new_gid}]}}
                      }}
                  )
                  print(f'  Add tester: HTTP {tr.status_code} — {tr.text[:200]}')
              else:
                  print(f'  Failed to create group: {cr.status_code} {cr.text[:200]}')

          groups_added = []
          for g in external_groups:
              gid   = g['id']
              gname = g['attributes'].get('name', gid)
              print(f'  Adding build to external group: {gname} ({gid})')
              resp = requests.post(
                  f'{BASE_URL}/betaGroups/{gid}/relationships/builds',
                  headers=hdrs(),
                  json={'data': [{'type': 'builds', 'id': build_id}]},
              )
              if resp.status_code in (200, 201, 204, 409):
                  print(f'    OK Added to {gname} (HTTP {resp.status_code})')
                  groups_added.append(gname)
              else:
                  print(f'    FAILED ({resp.status_code}): {resp.text[:300]}')

          # 4. Push TestFlight notification to testers
          if groups_added:
              r4 = requests.post(
                  f'{BASE_URL}/buildBetaNotifications',
                  headers=hdrs(),
                  json={'data': {'type': 'buildBetaNotifications',
                                 'relationships': {'build': {'data': {'type': 'builds', 'id': build_id}}}}}
              )
              if r4.status_code in (201, 204):
                  print('Push notification sent — testers will receive "is now available to test"')
              else:
                  print(f'  Notification: {r4.status_code} {r4.text[:200]}')

          print(f'TestFlight distribution complete. Build {build_version} added to: {", ".join(groups_added) or "none"}')
          PYEOF

      - name: Cleanup key file
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          # Tear down the temp keychain so it doesn't linger on cached runners.
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
