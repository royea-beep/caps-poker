name: iOS TestFlight

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for EAS archive
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Inject iOS distribution certificate
        run: |
          mkdir -p certs
          echo "${{ secrets.DISTRIBUTION_P12_BASE64 }}" | base64 -d > certs/distribution.p12
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 -d > certs/caps.mobileprovision

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (fire-and-forget)
        # No --wait, no --auto-submit — queues build on EAS Cloud and exits (~2-3 min CI).
        # EAS Cloud compiles (~30 min, free). Submit manually via testflight-manage.yml workflow_dispatch.
        run: eas build --platform ios --profile production --non-interactive

      # Web deploy: handled by Vercel native GitHub integration (auto-deploys on push)
      # No token needed. vercel.json in repo root configures the build.
