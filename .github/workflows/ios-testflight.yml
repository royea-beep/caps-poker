name: iOS TestFlight

# Standard EAS pipeline — matches Wingman approach
# Secrets required:
#   EXPO_TOKEN              — Expo account token (EAS builds + managed signing)
#   APPLE_API_KEY_BASE64    — Base64 of AuthKey_HH732W7XQJ.p8 (ASC API key)
#   APPLE_API_KEY_ID        — HH732W7XQJ
#   APPLE_API_ISSUER_ID     — 686f97b8-3f8a-40b7-a6cd-5293a3168439

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Apple API Key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > AuthKey_HH732W7XQJ.p8

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build + Auto-Submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit

      - name: Cleanup key file
        if: always()
        run: rm -f AuthKey_HH732W7XQJ.p8
