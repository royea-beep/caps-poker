name: ASC Certificate Audit (read-only)

# ============================================================================
# Asks APPLE what is actually valid, because the files cannot tell us.
#
# 2026-08-06: the rescued CAPS distribution certificate 2D06E852... parsed
# cleanly, carried its private key, matched its provisioning profile, and had a
# 2027-06-25 expiry -- and xcodebuild still rejected it as revoked. Revocation is
# server-side state at Apple; it is absent from the .p12 and even
# `security find-identity -v -p codesigning` reported the cert as valid.
# So local verification is structurally incapable of answering "can we sign?",
# and this workflow exists to ask the only authority that can.
#
# READ ONLY. It performs GETs and never creates, revokes or modifies anything.
# Serial numbers, expiry dates and profile names are not secrets; the ASC private
# key is never printed.
#
# It runs here rather than locally because the only working ASC key
# (APPLE_API_KEY_ID / APPLE_API_KEY_BASE64) lives in this repo's secrets -- every
# .p8 on the dev machine returns HTTP 401.
# ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query certificates and profiles
        env:
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEY_ID:-}" ] || [ -z "${ISSUER_ID:-}" ] || [ -z "${KEY_B64:-}" ]; then
            echo "::error::ASC API credentials missing."
            exit 1
          fi
          printf %s "$KEY_B64" | base64 -d > /tmp/asc.p8

          node - << 'SCRIPT'
          const fs = require('fs'), https = require('https'), { createSign } = require('crypto');
          const keyId = process.env.KEY_ID, issuer = process.env.ISSUER_ID;
          const pk = fs.readFileSync('/tmp/asc.p8', 'utf8');
          function token() {
            const h = Buffer.from(JSON.stringify({ alg:'ES256', kid:keyId, typ:'JWT' })).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const p = Buffer.from(JSON.stringify({ iss:issuer, iat:now, exp:now+900, aud:'appstoreconnect-v1' })).toString('base64url');
            const s = createSign('SHA256'); s.update(`${h}.${p}`);
            return `${h}.${p}.${s.sign({ key:pk, dsaEncoding:'ieee-p1363' }, 'base64url')}`;
          }
          function get(path) {
            return new Promise((res, rej) => {
              https.get({ hostname:'api.appstoreconnect.apple.com', path, headers:{ Authorization:`Bearer ${token()}` } }, r => {
                let b = ''; r.on('data', d => b += d);
                r.on('end', () => { if (r.statusCode !== 200) return rej(new Error(`HTTP ${r.statusCode}: ${b.slice(0,300)}`)); res(JSON.parse(b)); });
              }).on('error', rej);
            });
          }
          (async () => {
            const certs = await get('/v1/certificates?limit=200');
            console.log('=== CERTIFICATES (' + certs.data.length + ') ===');
            const dist = [];
            for (const c of certs.data) {
              const a = c.attributes;
              console.log([
                c.id, a.certificateType, a.serialNumber, a.expirationDate,
                (a.status || '(no status field)'), JSON.stringify(a.displayName)
              ].join(' | '));
              if (/DISTRIBUTION/.test(a.certificateType)) dist.push(a);
            }
            console.log('');
            console.log('=== DISTRIBUTION-TYPE CERT COUNT: ' + dist.length + ' ===');

            const WANT = {
              '2D06E852A4C64DC5B015DE4597EAA3B5': 'CAPS App Store (rescued, xcodebuild says revoked)',
              '77BE68C15C9F02A9142BE167E1364939': 'Wingman App Store + CAPS AD_HOC/dev (SHARED)',
              '4A0E0FCD1B1ABD79E7C8B40B3485B3DA': 'old local certs/distribution.pem',
              '45EBC138DF94E77658BA9558EAAE19FC': 'May cert, documented revoked',
              '540021A2976B9B6AC0BF86D6E35FE0BD': 'Wingman AD_HOC',
            };
            console.log('');
            console.log('=== SERIALS WE CARE ABOUT ===');
            for (const [serial, label] of Object.entries(WANT)) {
              const hit = certs.data.find(c => c.attributes.serialNumber === serial);
              console.log(`${serial} | ${hit ? 'PRESENT on team (' + hit.attributes.certificateType + ', exp ' + hit.attributes.expirationDate + ')' : 'ABSENT from team listing'} | ${label}`);
            }

            const profs = await get('/v1/profiles?limit=200&include=certificates');
            console.log('');
            console.log('=== PROFILES (' + profs.data.length + ') ===');
            const certById = {};
            for (const inc of (profs.included || [])) if (inc.type === 'certificates') certById[inc.id] = inc.attributes;
            for (const p of profs.data) {
              const a = p.attributes;
              const refs = ((p.relationships && p.relationships.certificates && p.relationships.certificates.data) || [])
                .map(r => (certById[r.id] ? certById[r.id].serialNumber : r.id));
              console.log([a.uuid, a.profileType, a.profileState, a.expirationDate, JSON.stringify(a.name), 'certs=' + (refs.join(',') || 'none')].join(' | '));
            }
          })().catch(e => { console.log('FAILED: ' + e.message); process.exit(1); });
          SCRIPT
          rm -f /tmp/asc.p8
