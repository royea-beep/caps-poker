name: ASC - Create CAPS App Store Profile (one-shot)

# ============================================================================
# WHY THIS, AND NOT A NEW CERTIFICATE
#
# The 2026-08-06 audit (asc-cert-audit.yml) showed:
#   - CAPS's rescued cert 2D06E852... is ABSENT from the team -> revoked. Its
#     profile 5e450e58... is gone with it. That is why the build failed.
#   - BUT cert 77BE68C1... (id 8477VM66KY, IOS_DISTRIBUTION, exp 2027-07-17) is
#     PRESENT AND LIVE, and we already hold its private key in the vault.
#   - Only 4 of 200 profiles are ACTIVE, and NONE is an App Store profile for
#     com.capspoker.app.
#
# So CAPS is not missing a certificate. It is missing a PROFILE. Issuing a new
# certificate would have consumed one of only two IOS_DISTRIBUTION slots and
# possibly required revoking a live cert that Wingman and 9Soccer depend on --
# for no reason. Creating a profile consumes no scarce resource, revokes nothing,
# and is reversible.
#
# One-shot: run it, take the output, delete the workflow.
# ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create IOS_APP_STORE profile for com.capspoker.app
        env:
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -eu
          printf %s "$KEY_B64" | base64 -d > /tmp/asc.p8
          node - << 'SCRIPT'
          const fs=require('fs'),https=require('https'),{createSign}=require('crypto');
          const keyId=process.env.KEY_ID, issuer=process.env.ISSUER_ID;
          const pk=fs.readFileSync('/tmp/asc.p8','utf8');
          const CERT_ID='8477VM66KY';            // live IOS_DISTRIBUTION, serial 77BE68C1...
          const BUNDLE='com.capspoker.app';
          function token(){
            const h=Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
            const now=Math.floor(Date.now()/1000);
            const p=Buffer.from(JSON.stringify({iss:issuer,iat:now,exp:now+900,aud:'appstoreconnect-v1'})).toString('base64url');
            const s=createSign('SHA256'); s.update(`${h}.${p}`);
            return `${h}.${p}.${s.sign({key:pk,dsaEncoding:'ieee-p1363'},'base64url')}`;
          }
          function req(method,path,body){
            return new Promise((res,rej)=>{
              const data=body?JSON.stringify(body):null;
              const r=https.request({hostname:'api.appstoreconnect.apple.com',path,method,
                headers:Object.assign({Authorization:`Bearer ${token()}`},data?{'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}:{})},
                resp=>{let b='';resp.on('data',d=>b+=d);resp.on('end',()=>{
                  if(resp.statusCode>=300) return rej(new Error(`HTTP ${resp.statusCode} ${path}: ${b.slice(0,600)}`));
                  res(JSON.parse(b));});});
              r.on('error',rej); if(data) r.write(data); r.end();
            });
          }
          (async()=>{
            const bids=await req('GET',`/v1/bundleIds?filter[identifier]=${BUNDLE}&limit=1`);
            if(!bids.data.length) throw new Error(`bundleId ${BUNDLE} not found on this team`);
            const bundleId=bids.data[0].id;
            console.log(`bundleId resource: ${bundleId} (${bids.data[0].attributes.name})`);
            const name=`CAPS AppStore ExpoFree ${Date.now()}`;
            const out=await req('POST','/v1/profiles',{data:{type:'profiles',
              attributes:{name,profileType:'IOS_APP_STORE'},
              relationships:{bundleId:{data:{type:'bundleIds',id:bundleId}},
                             certificates:{data:[{type:'certificates',id:CERT_ID}]}}}});
            const a=out.data.attributes;
            console.log('=== CREATED ===');
            console.log('PROFILE_NAME='+a.name);
            console.log('UUID='+a.uuid);
            console.log('STATE='+a.profileState);
            console.log('EXPIRES='+a.expirationDate);
            console.log('=== BASE64_BEGIN ===');
            console.log(a.profileContent);
            console.log('=== BASE64_END ===');
          })().catch(e=>{console.log('FAILED: '+e.message);process.exit(1);});
          SCRIPT
          rm -f /tmp/asc.p8
