name: ASC - Create CAPS App Store Profile (one-shot)

# ============================================================================
# Creates an IOS_APP_STORE provisioning profile for com.capspoker.app bound to
# the LIVE distribution certificate 8477VM66KY (serial 77BE68C1..., exp
# 2027-07-17), whose private key we already hold in the vault.
#
# No new certificate is issued: the 2026-08-06 audit showed CAPS's old cert
# 2D06E852... is ABSENT from the team (revoked) and took its profile with it,
# but 77BE68C1... is alive. CAPS was missing a PROFILE, not a certificate.
# Issuing a cert would have consumed one of only two IOS_DISTRIBUTION slots.
#
# ⚠️ EXACT-MATCH ASSERTION. The first attempt used
# `GET /v1/bundleIds?filter[identifier]=com.capspoker.app` and Apple returned the
# record for com.capspoker.app.DEV, producing a profile whose
# application-identifier was 3K9KJNGL9U.com.capspoker.app.dev. That would have
# failed the archive after the slowest step in the build. The filter is NOT
# reliably exact, so every bundleId is now listed and matched in code, and the
# job aborts if the match is not character-for-character.
# ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the profile (exact bundle match enforced)
        env:
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -eu
          printf %s "$KEY_B64" | base64 -d > /tmp/asc.p8
          node - << 'SCRIPT'
          const fs=require('fs'),https=require('https'),{createSign}=require('crypto');
          const keyId=process.env.KEY_ID, issuer=process.env.ISSUER_ID;
          const pk=fs.readFileSync('/tmp/asc.p8','utf8');
          const CERT_ID='8477VM66KY';
          const BUNDLE='com.capspoker.app';
          const STALE_PROFILE='864b3067-e14b-477b-a37f-bf8161b4ba0d'; // wrong-bundle profile from attempt 1
          function token(){
            const h=Buffer.from(JSON.stringify({alg:'ES256',kid:keyId,typ:'JWT'})).toString('base64url');
            const now=Math.floor(Date.now()/1000);
            const p=Buffer.from(JSON.stringify({iss:issuer,iat:now,exp:now+900,aud:'appstoreconnect-v1'})).toString('base64url');
            const s=createSign('SHA256'); s.update(`${h}.${p}`);
            return `${h}.${p}.${s.sign({key:pk,dsaEncoding:'ieee-p1363'},'base64url')}`;
          }
          function req(method,path,body){
            return new Promise((res,rej)=>{
              const data=body?JSON.stringify(body):null;
              const r=https.request({hostname:'api.appstoreconnect.apple.com',path,method,
                headers:Object.assign({Authorization:`Bearer ${token()}`},data?{'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}:{})},
                resp=>{let b='';resp.on('data',d=>b+=d);resp.on('end',()=>{
                  if(resp.statusCode===204) return res({});
                  if(resp.statusCode>=300) return rej(new Error(`HTTP ${resp.statusCode} ${path}: ${b.slice(0,500)}`));
                  res(b?JSON.parse(b):{});});});
              r.on('error',rej); if(data) r.write(data); r.end();
            });
          }
          (async()=>{
            // Clean up the wrong-bundle profile from the first attempt.
            try { await req('DELETE',`/v1/profiles/${STALE_PROFILE}`); console.log('deleted stale profile '+STALE_PROFILE); }
            catch(e){ console.log('stale profile cleanup skipped: '+e.message.slice(0,120)); }

            const all=await req('GET','/v1/bundleIds?limit=200');
            const caps=all.data.filter(b=>/capspoker/i.test(b.attributes.identifier));
            console.log('=== capspoker bundleIds on team ===');
            for(const b of caps) console.log(`  ${b.id} | ${b.attributes.identifier} | ${JSON.stringify(b.attributes.name)}`);
            const exact=all.data.filter(b=>b.attributes.identifier===BUNDLE);
            if(exact.length!==1){ throw new Error(`expected exactly 1 bundleId equal to "${BUNDLE}", found ${exact.length}`); }
            const bundleId=exact[0].id;
            console.log(`EXACT MATCH -> ${bundleId} (${exact[0].attributes.identifier})`);

            const name=`CAPS AppStore ExpoFree ${Date.now()}`;
            const out=await req('POST','/v1/profiles',{data:{type:'profiles',
              attributes:{name,profileType:'IOS_APP_STORE'},
              relationships:{bundleId:{data:{type:'bundleIds',id:bundleId}},
                             certificates:{data:[{type:'certificates',id:CERT_ID}]}}}});
            const a=out.data.attributes;
            console.log('=== CREATED ===');
            console.log('PROFILE_NAME='+a.name);
            console.log('UUID='+a.uuid);
            console.log('STATE='+a.profileState);
            console.log('EXPIRES='+a.expirationDate);
            console.log('=== BASE64_BEGIN ===');
            console.log(a.profileContent);
            console.log('=== BASE64_END ===');
          })().catch(e=>{console.log('FAILED: '+e.message);process.exit(1);});
          SCRIPT
          rm -f /tmp/asc.p8
