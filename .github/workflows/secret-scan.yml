# Standing guard — the half that cannot be skipped.
#
# 2026-09-06: a live Telegram bot token sat in this PUBLIC repository for 81 days, in
# supabase/functions/retriage-pending/index.ts and docs/MASTER_INDEX.md. Someone read it and
# rewrote the bot's profile. The sweep that followed found three more credentials in history,
# including an Anthropic API key baked into two shipped web bundles.
#
# A pre-commit hook is easy to skip (--no-verify) and does not exist in a fresh clone. This does.
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The false-positive sweep below replays the guard over recent real commits, so it needs
          # more than the single commit a default checkout fetches.
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Prove the detector still fires before trusting it to say "clean".
      # A scanner whose patterns have silently stopped matching reports success on a leak.
      - name: Self-test the detector
        run: node scripts/scan-secrets.mjs --self-test
      - name: Scan the tree
        run: node scripts/scan-secrets.mjs

      # The OTHER half of "does this guard work". A scanner that refuses ordinary commits gets
      # deleted by the next person who hits it, so the rate at which it fires on real work is
      # measured on every run rather than asserted once. It reports; it does not fail the job,
      # because a genuine credential in recent history SHOULD show up here.
      - name: False-positive rate over recent commits
        run: node tests/secret-scan-falsepos.mjs 25
