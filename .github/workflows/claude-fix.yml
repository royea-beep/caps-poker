name: Claude Auto-Fix

on:
  repository_dispatch:
    types: [auto-fix, claude-fix, claude-fix-no-build, claude-fix-and-deploy]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are fixing a bug in CAPS Poker (React Native + Expo SDK 55).

            ${{ github.event.client_payload.fix_prompt || github.event.client_payload.plan }}

            Summary: ${{ github.event.client_payload.summary }}

            RULES:
            - Read the relevant files FIRST
            - Apply the fix
            - Run: npx tsc --noEmit
            - Run: npx jest --forceExit
            - Commit with: git add -A && git commit -m "fix: [auto] ${{ github.event.client_payload.summary }}" && git push
          claude_args: "--dangerously-skip-permissions --allowedTools Bash,Read,Write,Edit"

      - name: Notify Telegram
        if: always()
        run: |
          if git log --oneline -1 | grep -q "\[auto\]"; then
            RESULT="fixed"
            HAS_CHANGES="true"
          else
            RESULT="no_changes"
            HAS_CHANGES="false"
          fi
          curl -s -X POST \
            "https://gxrpunvhjcrzqnitbqah.supabase.co/functions/v1/telegram-bot-handler" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"autofix_callback\",
              \"run_id\": ${{ github.run_id }},
              \"result\": \"${RESULT}\",
              \"has_changes\": ${HAS_CHANGES}
            }" || echo "Callback failed"
