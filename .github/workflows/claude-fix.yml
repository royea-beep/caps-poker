name: Claude Auto-Fix

on:
  repository_dispatch:
    types: [auto-fix, claude-fix, claude-fix-no-build, claude-fix-and-deploy]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY not set"
            exit 1
          fi
          echo "API key present (length ${#ANTHROPIC_API_KEY})"

      - name: Run Claude Code Action
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            You are fixing a bug in CAPS Poker (React Native + Expo SDK 55).
            Here is the fix request:

            ${{ github.event.client_payload.fix_prompt || github.event.client_payload.plan }}

            Summary: ${{ github.event.client_payload.summary }}

            RULES:
            - Read the relevant files FIRST
            - Apply the fix
            - Run: npx tsc --noEmit
            - Run: npx jest --forceExit
            - If tests pass, commit with: git add -A && git commit -m "fix: [auto] ${{ github.event.client_payload.summary }}" && git push
          allowed_tools: "Bash,Read,Write,Edit"
          timeout_minutes: "25"

      - name: Check results and notify
        if: always()
        run: |
          if git log --oneline -1 | grep -q "\[auto\]"; then
            RESULT="fixed"
            HAS_CHANGES="true"
          else
            RESULT="no_changes"
            HAS_CHANGES="false"
          fi

          curl -s -X POST \
            "https://gxrpunvhjcrzqnitbqah.supabase.co/functions/v1/telegram-bot-handler" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"autofix_callback\",
              \"run_id\": ${{ github.run_id }},
              \"result\": \"${RESULT}\",
              \"has_changes\": ${HAS_CHANGES}
            }" || echo "Callback failed"
