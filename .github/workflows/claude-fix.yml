name: Claude Auto-Fix

on:
  repository_dispatch:
    types: [claude-fix-no-build, claude-fix-and-deploy, claude-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIX_SUMMARY: ${{ github.event.client_payload.summary }}
          FIX_PLAN: ${{ github.event.client_payload.plan }}
          FIX_FILES: ${{ github.event.client_payload.files }}
          FIX_SEVERITY: ${{ github.event.client_payload.severity }}
          FIX_SESSION_ID: ${{ github.event.client_payload.session_id }}
        run: |
          echo "=== CAPS POKER — WhatsApp Bot Auto-Fix ==="
          echo "Summary: $FIX_SUMMARY"
          echo "Severity: $FIX_SEVERITY"
          echo "Files: $FIX_FILES"
          npm install -g @anthropic-ai/claude-code
          timeout 35m claude --print "Read MEMORY.md. Iron Rules 1-8 confirmed. Standing Orders: Fix autonomously. Never give user commands.

          BUG REPORT FROM WHATSAPP:
          Summary: $FIX_SUMMARY
          Plan: $FIX_PLAN
          Files: $FIX_FILES
          Severity: $FIX_SEVERITY

          Fix this bug. Keep it focused — read only the files in FILES, make the minimum change to fix the bug, run npx tsc --noEmit. Do not explore unrelated files." --dangerously-skip-permissions || echo "Claude fix timed out or errored — proceeding to commit any partial changes"

      - name: Commit and push
        env:
          FIX_SUMMARY: ${{ github.event.client_payload.summary }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          git config user.email "claude-bot@caps-poker.app"
          git config user.name "Claude Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          elif [ "$EVENT_TYPE" = "claude-fix-no-build" ]; then
            git commit -m "fix: [WhatsApp] $FIX_SUMMARY [auto-fix][skip ci]"
            git push
          else
            git commit -m "fix: [WhatsApp] $FIX_SUMMARY [auto-fix]"
            git push
          fi

      - name: Deploy web to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN — skipping web deploy"
            exit 0
          fi
          npm install -g vercel
          npx expo export --platform web --clear
          node scripts/fix-web-html.js
          cd dist && vercel --prod --yes --token "$VERCEL_TOKEN"

      - name: Notify via WhatsApp
        if: always()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: whatsapp:+14155238886
          TWILIO_TO: whatsapp:+972504141513
          FIX_SUMMARY: ${{ github.event.client_payload.summary }}
          EVENT_TYPE: ${{ github.event.action }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$TWILIO_AUTH_TOKEN" ]; then
            echo "Twilio secrets not set — skipping WhatsApp notification"
            exit 0
          fi
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ "$JOB_STATUS" = "success" ]; then
            if [ "$EVENT_TYPE" = "claude-fix-no-build" ]; then
              MSG="✅ תיקון הושלם! commit: $COMMIT — $FIX_SUMMARY (לא עלתה גרסה)"
            else
              MSG="✅ תיקון הושלם! commit: $COMMIT — $FIX_SUMMARY (build ל-TestFlight בדרך...)"
            fi
          else
            MSG="❌ תיקון נכשל. בדוק GitHub Actions לפרטים."
          fi
          curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
            -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" \
            --data-urlencode "From=$TWILIO_FROM" \
            --data-urlencode "To=$TWILIO_TO" \
            --data-urlencode "Body=$MSG"
